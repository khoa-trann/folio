# Render Blueprint — free web service for Folio.
# Render → New → Blueprint → pick this repository.
services:
  - type: web
    name: folio
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "No build step"
    startCommand: node server.js
    healthCheckPath: /api/catalog
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REFRESH_TOKEN
        generateValue: true
      # Free instances have 512 MB: boot from the committed Gutenberg index, never rebuild it here.
      - key: FOLIO_PG_SNAPSHOT_ONLY
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320"
